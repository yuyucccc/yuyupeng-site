<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
<link rel="canonical" href="https://{{DOMAIN}}/">
<meta property="og:type" content="website">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESC}}">
<meta property="og:url" content="https://{{DOMAIN}}/">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="{{FAVICON}}">
<script>document.documentElement.className+=" js"</script>
<link rel="preload" href="assets/fonts/PlayfairDisplay-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/css/v2.css">
<script src="assets/js/personal-logo-fusion.js" defer></script>
</head>
<body class="front">

<a class="wordmark" href="/">YUYUPENG</a>

<div class="frontwrap">
  <button class="mark" id="mark" type="button" aria-label="Open the work">
    <personal-logo-fusion duration="6" minimum="0.32" fill-strength="0.75"
      >{{EYE}}</personal-logo-fusion>
  </button>
</div>

<nav class="field" aria-label="Selected work">
  {{NODES}}
</nav>

<div class="dot" id="dot" aria-hidden="true"></div>

<script src="assets/js/v2.js" defer></script>
</body>
</html>
