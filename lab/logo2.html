<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Logo · 渐变版</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#000;padding:40px clamp(16px,4vw,56px) 90px;
  font:400 14px/1.55 Helvetica,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
h1{font-size:13px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;margin:0 0 6px}
.note{font-size:12px;color:#777;margin:0 0 34px;max-width:66ch;line-height:1.6}
.grid{display:grid;gap:2px;background:#e8e8e8;
  grid-template-columns:repeat(auto-fill,minmax(268px,1fr))}
.cell{background:#fff;padding:30px 20px 22px;display:flex;flex-direction:column;
  align-items:center;gap:16px}
.box{height:190px;display:flex;align-items:center;justify-content:center}
.tag{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.desc{font-size:11px;color:#777;text-align:center;line-height:1.55;min-height:3.4em}
svg{width:230px;height:auto;display:block}

/* 轮廓永远不动；转的是内部的渐变层 */
.turn{transform-origin:50% 50%;animation:turn 9s linear infinite}
.turn--slow{animation-duration:14s}
.turn--rev{animation-direction:reverse}
@keyframes turn{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.turn{animation:none}}
</style>
</head>
<body>
<h1>Logo · 渐变版（轮廓不动，内部三维旋转）</h1>
<p class="note">两个圆的外形始终不变，转动的是里面的渐变——像球体在壳里转。
  保留你原设计的双环结构和交叠关系，蓝色换成黑灰。挑一个编号给我。</p>
<div class="grid" id="g"></div>

<script>
// 圆心距 52，半径 50 —— 和原 logo 的交叠比例一致
var R = 50, DX = 26;

function defs(id, kind) {
  var g = '';
  if (kind === 'sphere')
    g = '<radialGradient id="' + id + '" cx="34%" cy="30%" r="78%">' +
        '<stop offset="0%" stop-color="#8e8e8e"/><stop offset="52%" stop-color="#2a2a2a"/>' +
        '<stop offset="100%" stop-color="#000"/></radialGradient>';
  if (kind === 'soft')   // 接近原设计：中间亮，向外压深
    g = '<radialGradient id="' + id + '" cx="50%" cy="46%" r="66%">' +
        '<stop offset="0%" stop-color="#fff"/><stop offset="58%" stop-color="#e2e2e2"/>' +
        '<stop offset="100%" stop-color="#6f6f6f"/></radialGradient>';
  if (kind === 'sweep')
    g = '<linearGradient id="' + id + '" x1="0" y1="0" x2="1" y2="0.35">' +
        '<stop offset="0%" stop-color="#000"/><stop offset="46%" stop-color="#111"/>' +
        '<stop offset="70%" stop-color="#9a9a9a"/><stop offset="100%" stop-color="#000"/></linearGradient>';
  if (kind === 'conic')  // 用多段线性渐变近似锥形，像金属环转
    g = '<linearGradient id="' + id + '" x1="0" y1="0" x2="1" y2="1">' +
        '<stop offset="0%" stop-color="#000"/><stop offset="35%" stop-color="#c8c8c8"/>' +
        '<stop offset="62%" stop-color="#151515"/><stop offset="100%" stop-color="#7d7d7d"/></linearGradient>';
  return g;
}

// 一枚标记：clip 固定住圆的外形，内部渐变层旋转
function mark(o) {
  var k = o.key, out = '';
  var idL = k + 'L', idR = k + 'R';
  out += '<svg viewBox="-92 -62 184 124" xmlns="http://www.w3.org/2000/svg">';
  out += '<defs>' + defs(idL, o.grad) + defs(idR, o.grad);
  out += '<clipPath id="' + k + 'cl"><circle cx="' + (-DX) + '" cy="0" r="' + R + '"/></clipPath>';
  out += '<clipPath id="' + k + 'cr"><circle cx="' + DX + '" cy="0" r="' + R + '"/></clipPath>';
  // 交叠区 = 右圆裁进左圆
  out += '<clipPath id="' + k + 'ci" clipPathUnits="userSpaceOnUse">' +
         '<circle cx="' + DX + '" cy="0" r="' + R + '"/></clipPath>';
  out += '</defs>';

  var spin = 'turn' + (o.slow ? ' turn--slow' : '');
  // 左右两个圆：外形由 clipPath 固定，里面的大方块带渐变在转
  out += '<g clip-path="url(#' + k + 'cl)"><g class="' + spin + '" style="transform-origin:' + (-DX) + 'px 0px">' +
         '<rect x="' + (-DX-80) + '" y="-80" width="160" height="160" fill="url(#' + idL + ')"/></g></g>';
  out += '<g clip-path="url(#' + k + 'cr)"><g class="' + spin + (o.counter ? ' turn--rev' : '') +
         '" style="transform-origin:' + DX + 'px 0px">' +
         '<rect x="' + (DX-80) + '" y="-80" width="160" height="160" fill="url(#' + idR + ')"/></g></g>';

  // 交叠处挖空成白（形态 3）
  if (o.knock)
    out += '<g clip-path="url(#' + k + 'cl)"><g clip-path="url(#' + k + 'ci)">' +
           '<rect x="-92" y="-62" width="184" height="124" fill="#fff"/></g></g>';

  // 外圈细线（形态 4）
  if (o.outer) {
    out += '<circle cx="' + (-DX) + '" cy="0" r="' + (R + 9) + '" fill="none" stroke="#000" stroke-width="1" opacity=".5"/>';
    out += '<circle cx="' + DX + '" cy="0" r="' + (R + 9) + '" fill="none" stroke="#000" stroke-width="1" opacity=".5"/>';
  }
  // 圆本身的描边
  if (o.edge) {
    out += '<circle cx="' + (-DX) + '" cy="0" r="' + R + '" fill="none" stroke="#000" stroke-width="1.2"/>';
    out += '<circle cx="' + DX + '" cy="0" r="' + R + '" fill="none" stroke="#000" stroke-width="1.2"/>';
  }
  out += '</svg>';
  return out;
}

var V = [
  {key:"v1", grad:"soft",   outer:1, edge:1, knock:0, slow:1,
   name:"1 · 原设计转黑", desc:"最贴近你现在的 logo：中间亮、向外压深，双环保留。内部渐变缓慢旋转。"},
  {key:"v2", grad:"sphere", outer:0, edge:0, knock:1,
   name:"2 · 实心球 + 挖空", desc:"两枚黑球，高光绕着转；交叠处挖成白色透镜 —— 瞳孔。"},
  {key:"v3", grad:"sphere", outer:1, edge:0, knock:1,
   name:"3 · 球 + 挖空 + 双环", desc:"形态 3 和 4 合起来：黑球 + 白透镜 + 外圈细线。"},
  {key:"v4", grad:"conic",  outer:1, edge:1, knock:0, counter:1,
   name:"4 · 金属环对转", desc:"渐变像抛光金属，两圆反向转，交叠处自然产生明暗交错。"},
  {key:"v5", grad:"sweep",  outer:0, edge:1, knock:1, slow:1,
   name:"5 · 光扫过", desc:"一道亮光缓慢扫过黑面，像镜头镀膜反光。"},
  {key:"v6", grad:"soft",   outer:1, edge:1, knock:1, counter:1,
   name:"6 · 原设计 + 挖空", desc:"保留你的柔和渐变和双环，但交叠处挖白，读起来更像眼睛。"}
];
document.getElementById('g').innerHTML = V.map(function(o){
  return '<div class="cell"><div class="box">' + mark(o) + '</div>' +
    '<div class="tag">' + o.name + '</div><div class="desc">' + o.desc + '</div></div>';
}).join('');
</script>
</body>
</html>
